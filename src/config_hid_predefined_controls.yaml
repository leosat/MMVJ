hid_controls:
  FORCE_FEEDBACK_X:
    type: FORCE_FEEDBACK_X
    range: [ -32768, 32767 ]
    properties: { resolution: 1, fuzz: 0, flat: 0 }
    initial_value: 0
    description: "Special, fake, control to expose force feedback X component coming from device. Currently R/O, write ignored (could reuse it to inject Constant force on unowned HID though)."

  FORCE_FEEDBACK_Y:
    type: FORCE_FEEDBACK_Y
    range: [ -32768, 32767 ]
    properties: { resolution: 1, fuzz: 0, flat: 0 }
    initial_value: 0
    description: "Special, fake, control to expose force feedback Y component coming from device. Currently R/O, write ignored (could reuse it to inject Constant force on unowned HID though)."

  ABS_X:
    type: ABS_X
    range: [ 0, 32767 ] ## <--- this works by default with ffcfstress utility ##... and this doesn't ---> [-32768, 32767]
    properties: { resolution: 1, fuzz: 0, flat: 0 }
    initial_value: 0
    description: "Primary X-axis (left stick horizontal), positive range."

  ABS_Y:
    type: ABS_Y
    range: [ 0, 32767 ]
    properties: { resolution: 1, fuzz: 0, flat: 0 }
    initial_value: 0
    description: "Primary Y-axis (left stick vertical)"

  ABS_Z:
    type: ABS_Z
    range: [ 0, 32767 ]
    properties: { resolution: 1, fuzz: 0, flat: 0 }
    initial_value: 0
    description: "Z-axis (left trigger analog)"

  ABS_RX:
    type: ABS_RX
    range: [ 0, 32767 ]
    properties: { resolution: 1, fuzz: 0, flat: 0 }
    initial_value: 0
    description: "Right X-axis (right stick horizontal)"

  ABS_RY:
    type: ABS_RY
    range: [ 0, 32767 ]
    properties: { resolution: 1, fuzz: 0, flat: 0 }
    initial_value: 0
    description: "Right Y-axis (right stick vertical)"

  ABS_RZ:
    type: ABS_RZ
    range: [ 0, 32767 ]
    properties: { resolution: 1, fuzz: 0, flat: 0 }
    initial_value: 0
    description: "Right Z-axis (right trigger analog)"

  ABS_WHEEL:
    type: ABS_WHEEL
    range: [ 0, 32767 ]
    properties: { resolution: 1, fuzz: 0, flat: 0 }
    initial_value: 0
    description: "Steering wheel axis"

  ABS_GAS:
    type: ABS_GAS
    range: [0, 32767]
    properties: { resolution: 1, fuzz: 0, flat: 0 }
    initial_value: 0
    description: "Gas/throttle pedal"

  ABS_BRAKE:
    type: ABS_BRAKE
    range: [0, 32767]
    properties: { resolution: 1, fuzz: 0, flat: 0 }
    initial_value: 0
    description: "Brake pedal"

  ABS_HAT0X:
    type: ABS_HAT0_X # TODO: HAT0X
    range: [-1, 1]
    initial_value: 0
    description: "D-pad horizontal"

  ABS_HAT0Y:
    type: ABS_HAT0_Y
    range: [-1, 1]
    initial_value: 0
    description: "D-pad vertical"

  # Buttons - Xbox style naming
  BTN_A:
