midi_controls:
  FILTER_RESPONSE:
    midi_message:
      type: control_change
      channel: any
      number: 71
    range: [0, 127]
    description: "Filter response (CC71)"

  RELEASE_TIME:
    midi_message:
      type: control_change
      channel: any
      number: 72
    range: [0, 127]
    description: "Release time (CC72)"

  ATTACK_TIME:
    midi_message:
      type: control_change
      channel: any
      number: 73
    range: [0, 127]
    description: "Attack time (CC73)"

  FILTER_CUTOFF:
    midi_message:
      type: control_change
      channel: any
      number: 74
    range: [0, 127]
    description: "Filter cutoff (CC74)"

  DECAY_TIME:
    midi_message:
      type: control_change
      channel: any
      number: 75
    range: [0, 127]
    description: "Decay time (CC75)"
    
  SUSTAIN_PEDAL:
    midi_message:
      type: control_change
      channel: any
      number: 64
    range: [0, 127]
    description: "Sustain pedal (CC64)"

  PORTAMENTO_PEDAL:
    midi_message:
      type: control_change
      channel: any
      number: 65
    range: [0, 127]
    description: "Portamento (CC65)"

  SUSTENUDO_PEDAL:
    midi_message:
      type: control_change
      channel: any
      number: 66
    range: [0, 127]
    description: "Sostenudo (CC66)"

  SOFT_PEDAL:
    midi_message:
      type: control_change
      channel: any
      number: 67
    range: [0, 127]
    description: "Soft (CC67)"

  BREATH:
    midi_message:
      type: control_change
      channel: any
      number: 2
    range: [0, 127]
    description: "Breath Controller (CC2)"

  PITCH_WHEEL:
    midi_message:
      type: pitch_wheel
      channel: any
    range: [-8192, 8191]
    description: "Pitch bend wheel"

  MODULATION_WHEEL:
    midi_message:
      type: control_change
      channel: any
      number: 1
    range: [0, 127]
    description: "Modulation wheel (CC1)"

  EXPRESSION_PEDAL:
    midi_message:
      type: control_change
      channel: any
      number: 11
    range: [0, 127]
    description: "Expression pedal (CC11)"

  VOLUME:
    midi_message:
      type: control_change
      channel: any
      number: 7
    range: [0, 127]
    description: "Main volume (CC7)"

  PAN:
    midi_message:
      type: control_change
      channel: any
      number: 10
    range: [0, 127]
    description: "Pan position (CC10)"

  AFTERTOUCH:
    midi_message:
      type: aftertouch
      channel: any
    range: [0, 127]
    description: "Channel aftertouch"

  # Note definitions - all chromatic notes (all octaves)
  NOTE_C:
    midi_message:
      type: note
      channel: any
      number: [0, 12, 24, 36, 48, 60, 72, 84, 96, 108, 120]
    range: [0, 127]
    description: "Note C (all octaves)"

  NOTE_C#:
    midi_message:
      type: note
      channel: any
      number: [1, 13, 25, 37, 49, 61, 73, 85, 97, 109, 121]
    range: [0, 127]
    description: "Note C# (all octaves)"

  NOTE_D:
