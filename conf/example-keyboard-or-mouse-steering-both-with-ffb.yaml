# mmvj configuration.
# mmvj version: 2026.8.4-3
# Autogenerated at: 2026-08-07 11:02:43.236335 UTC

description: |+
  
  ############################## MOUSE + KEYBOARD STEERING CONFIGURATION EXAMPLE #########################################
  #
  
  - Keyboard or mouse steering is automatically actiated whenever mouse is moved or keyboard keys left/right are pressed.
  - When mouse steering active, 
    1) move mouse inwards and outwards to simulate hands holding steering wheel firmly or loose.
    2) left and right movements are mapped to steering direction.
  - When keyboard steering active, 
    1) down button simulates hold factor and decreases sensitivity, 
       up button increases sensitivity, also increasing hold factor.
    2) left and right buttons are mapped to steering direction.
  
  #
  ################################################## Have fun! ##########################################################
  
global:
  idle_tick_rate: 70
  persistent_joysticks: true
devices:
  hid:
    Virtual steering wheel:
      enabled: true
      description: ""
      name: MMVJ Steering Wheel
      persistent: true
      bus:
        type: Virtual
        vendor_id: 42
        product_id: 1
        version: 1
      force_feedback:
        enabled: true
        effects:
        - Constant
        - Spring
        - Friction
        - Ramp
        max_effects: 16
      controls:
        ABS_RY:
          type: ABS_RY
          range:
          - 0.0
          - 32767.0
        ABS_X:
          type: ABS_X
          range:
          - 0.0
          - 32767.0
        BTN_EAST:
          type: BTN_EAST
          range:
          - 0.0
          - 1.0
        BTN_NORTH:
          type: BTN_NORTH
          range:
          - 0.0
          - 1.0
        BTN_SOUTH:
          type: BTN_SOUTH
          range:
          - 0.0
          - 1.0
        BTN_WEST:
          type: BTN_WEST
          range:
          - 0.0
          - 1.0
        Dummy axis for Wine:
          type: ABS_Y
          range:
          - 0.0
          - 32767.0
        FORCE_FEEDBACK_X:
          type: FORCE_FEEDBACK_X
          range:
          - -32768.0
          - 32767.0
        FORCE_FEEDBACK_Y:
          type: FORCE_FEEDBACK_Y
          range:
          - -32768.0
          - 32767.0
    any_kbd:
      enabled: true
      description: ""
      match_name_regex: .+
      controls:
        KEY_DOWN:
          type: KEY_DOWN
          range:
          - 0.0
          - 2.0
        KEY_LEFT:
          type: KEY_LEFT
          range:
          - 0.0
          - 2.0
        KEY_RIGHT:
          type: KEY_RIGHT
          range:
          - 0.0
          - 2.0
        KEY_SPACE:
          type: KEY_SPACE
          range:
          - 0.0
          - 2.0
        KEY_UP:
          type: KEY_UP
          range:
          - 0.0
          - 2.0
    any_mouse:
      enabled: true
      description: ""
      match_name_regex: .+
      controls:
        REL_X:
          type: REL_X
          range:
          - -127.0
          - 127.0
        REL_Y:
          type: REL_Y
          range:
          - -127.0
          - 127.0
variables:
  "@ KBD steering: autocentering along force feedback":
    range:
    - 0.0
    - 1.0
    value: 0.7
  "@ KBD steering: autocentering halflife (sec)":
    range:
    - 0.0
    - 1.0
    value: 0.13
  "@ KBD steering: sensitivity base * 0.1":
    range:
    - 0.0
    - 1.0
    value: 0.22
  "@ KBD steering: sensitivity decrease multiplier":
    range:
    - 0.0
    - 1.0
    value: 0.35
  "@ KBD steering: sensitivity increase multiplier":
    range:
    - 1.0
    - 5.0
    value: 3.3
  "@ MS steering: autocentering halflife (sec)":
    range:
    - 0.0
    - 1.0
    value: 0.31
  "@ MS steering: sensitivity":
    range:
    - 0.0
    - 1.0
    value: 0.06
  "KBD STEERING: SENSITIVITY APPLIED":
    range:
    - 0.0
    - 1.0
  STEERING ACCUMULATOR:
    range:
    - -100.0
    - 100.0
  "STEERING HOLD FACTOR: APPLIED":
    range:
    - 0.0
    - 1.0
  "STEERING HOLD FACTOR: MOUSE":
    range:
    - 0.0
    - 100.0
mappings:
- name: "MOUSE STEERING: HOLD"
  enabled: true
  source:
    dev: any_mouse
    ctl: REL_Y
  destination:
    var: "STEERING HOLD FACTOR: MOUSE"
  transformation:
  - integrate:
      enabled: true
      range:
      - 0.0
      - 600.0
      deadzone_norm: 0.0
      smoothing_alpha: 0.5
  - s_curve:
      enabled: true
      steepness: 8.0
  - clamp:
      enabled: true
      range:
      - 0.0
      - 530.0
      override_range: false
- name: MOUSE OR KEYBOARD STEERING
  enabled: true
  source:
    value: 0.0
    range:
    - 0.0
    - 0.0
  destination:
    dev: Virtual steering wheel
    ctl: ABS_X
  transformation:
  - script:
      desc: |
        This script choosees between mouse and keyboard signals to provide with further
        input to steering transformation. When either is moved - the mode is switched
        between mouse and keyboard steering.
      enabled: true
      lang: Luau
      script: |-
        --print(base_rate())
        --print(is_idle())
        --print(read("kbd_hold"))
        --print(read("kbd_up"))
        --print(read("ms"))
        
        ks_threshold = 0.01
        ms_threshold = 0.1
        
        out_scale = 127
        out_lo = -out_scale
        out_hi = out_scale
        
        kbd_left  = -transform("kbd_left_tfm", read("kbd_left"))
        kbd_right =  transform("kbd_right_tfm", read("kbd_right"))
        
        ks = math.clamp(kbd_left + kbd_right, -1, 1)
        kbd_up = read("kbd_up")
        kbd_hold = read("kbd_hold")
        ks_hold_is_active = kbd_hold > ks_threshold or kbd_up > ks_threshold 
        
        ms = read("ms")
        
        if use_mouse_steering == nil then
          use_mouse_steering = true
        elseif use_mouse_steering and (
          math.abs(ks) > ks_threshold or ks_hold_is_active
        ) then
          print("switched to keyboard steering [.'.]: left, righ, up ((configurable)increase steering speed + hold factor), down ((configurable) decrease in steering speed + hold factor)")
          use_mouse_steering = false
        elseif not use_mouse_steering and math.abs(ms) > ms_threshold then
          print("switched to mouse steering (|): left, righ, inwards == hold factor increase, outwards == hold factor decrease")
          use_mouse_steering = true
        end
        
        if use_mouse_steering then
          write("hold_applied", read("ms_hold"))
          write(0, transform("mouse_steering", math.clamp(ms*out_scale, out_lo, out_hi)))
        else
          hold_applied = transform("kbd_hold_tfm", math.clamp(read("kbd_hold") + read("kbd_up"), 0, 2))
          write("hold_applied", hold_applied)
          sens = read("ks_sens_base") * 0.1
          if kbd_up > 0 then sens *= read("ks_sens_inc") end
          if hold_applied > 0 then sens *= read("ks_sens_dec") end
          write("kbd_sens", sens);
          out =  
            transform(
              "kbd_steering",
              math.clamp(ks * out_scale, out_lo, out_hi))
        
          if not ks_hold_is_active then
            out = transform("kbd_steering_post", out)
          end
        
          write(0, transform("kbd_steering_post_smoothing", out))
        
        end
      output_interval:
      - -1.0
      - 1.0
      output_relativity: Abs
      aux_srcs:
        kbd_hold:
          remap_to_interval:
          - 0.0
          - 2.0
          source:
            dev: any_kbd
            ctl: KEY_DOWN
        kbd_hold_steering_sensitivity:
          source:
            value: 0.6
            range:
            - 0.0
            - 2.0
        kbd_left:
          remap_to_interval:
          - 0.0
          - 2.0
          source:
            dev: any_kbd
            ctl: KEY_LEFT
        kbd_right:
          remap_to_interval:
          - 0.0
          - 2.0
          source:
            dev: any_kbd
            ctl: KEY_RIGHT
        kbd_up:
          source:
            dev: any_kbd
            ctl: KEY_UP
        ks_sens_base:
          source:
            var: "@ KBD steering: sensitivity base * 0.1"
        ks_sens_dec:
          remap_to_interval:
          - 0.0
          - 1.0
          source:
            var: "@ KBD steering: sensitivity decrease multiplier"
        ks_sens_inc:
          source:
            var: "@ KBD steering: sensitivity increase multiplier"
        ms:
          remap_to_interval:
          - -1.0
          - 1.0
          source:
            dev: any_mouse
            ctl: REL_X
        ms_hold:
          remap_to_interval:
          - 0.0
          - 1.0
          source:
            var: "STEERING HOLD FACTOR: MOUSE"
      aux_dsts:
        hold_applied:
          destination:
            var: "STEERING HOLD FACTOR: APPLIED"
        kbd_sens:
          destination:
            var: "KBD STEERING: SENSITIVITY APPLIED"
      aux_transformations:
        kbd_hold_tfm:
          desc: Transform for Kbd Hold Factor (key Down)
          in_range:
          - 0.0
          - 2.0
          in_relativity: Rel
          steps:
          - clamp:
              enabled: true
              range:
              - 0.0
              - 1.0
              override_range: true
          - script:
              enabled: false
              lang: Luau
              script: |-
                -- Just checking recursive script execution
                print(inputs[0])
                outputs[0] = inputs[0]
          - ema:
              enabled: true
              on_relative_input_feed_on_idle: true
              tau: 0.06
          - clamp:
              enabled: true
              range:
              - 0.0
              - 0.9
              override_range: false
        kbd_left_tfm:
          desc: Transform for Left Button Pressed
          in_range:
          - 0.0
          - 2.0
          in_relativity: Rel
          steps:
          - clamp:
              enabled: true
              range:
              - 0.0
              - 1.0
              override_range: true
        kbd_right_tfm:
          desc: Transform for Right Button Pressed
          in_range:
          - 0.0
          - 2.0
          in_relativity: Rel
          steps:
          - clamp:
              enabled: true
              range:
              - 0.0
              - 1.0
              override_range: true
        kbd_steering:
          desc: Transform for Left and Right buttons summed
          in_range:
          - -127.0
          - 127.0
          in_relativity: Rel
          steps:
          - steering:
              enabled: true
              accumulator:
                var: STEERING ACCUMULATOR
              deadzone_counts: 0.0
              input_gain:
                var: "KBD STEERING: SENSITIVITY APPLIED"
              auto_center_halflife:
                var: "@ KBD steering: autocentering halflife (sec)"
              auto_center_along_force_feedback:
                var: "@ KBD steering: autocentering along force feedback"
              hold_factor:
                var: "STEERING HOLD FACTOR: APPLIED"
              force_feedback:
                enabled: true
                gain: 0.7
                invert: false
                component: X
                transformation:
                - one_euro:
                    enabled: true
                    beta: 0.007
                    min_cutoff_hz: 1.0
                    d_cutoff_hz: 1.0
              integrated_user_input_transform:
              - one_euro:
                  enabled: false
                  beta: 0.007
                  min_cutoff_hz: 5.0
                  d_cutoff_hz: 1.0
        kbd_steering_post:
          in_range:
          - -1.0
          - 1.0
          in_relativity: Abs
          steps:
          - exp:
              enabled: true
              base: 1.6
              center_symmetric: true
        kbd_steering_post_smoothing:
          in_range:
          - -1.0
          - 1.0
          in_relativity: Abs
          steps:
          - ema:
              enabled: true
              tau: 0.02
        mouse_steering:
          in_range:
          - -127.0
          - 127.0
          in_relativity: Rel
          steps:
          - steering:
              enabled: true
              accumulator:
                var: STEERING ACCUMULATOR
              deadzone_counts: 0.0
              input_gain:
                var: "@ MS steering: sensitivity"
              auto_center_halflife:
                var: "@ MS steering: autocentering halflife (sec)"
              auto_center_along_force_feedback: 0.0
              hold_factor:
                var: "STEERING HOLD FACTOR: APPLIED"
              force_feedback:
                enabled: true
                gain: 1.0
                invert: false
                component: X
                transformation:
                - one_euro:
                    enabled: true
                    beta: 0.007
                    min_cutoff_hz: 1.0
                    d_cutoff_hz: 1.0
              integrated_user_input_transform:
              - exp:
                  enabled: true
                  base: 1.8
                  center_symmetric: true
ui:
  monitors:
  - name: Steering
    desc: ""
    enabled: true
    position:
      dev: Virtual steering wheel
      ctl: ABS_X
    hold:
      var: "STEERING HOLD FACTOR: APPLIED"
