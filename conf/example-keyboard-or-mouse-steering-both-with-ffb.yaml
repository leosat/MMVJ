# mmvj configuration.
# mmvj version: 2026.9.6-0
# Autogenerated at: 2026-09-06 17:09:29.439546292 UTC

description: |+
  
  ############################## MOUSE + KEYBOARD STEERING CONFIGURATION EXAMPLE #########################################
  #
  
  - Keyboard or mouse steering is automatically actiated whenever mouse is moved or keyboard keys left/right are pressed.
  - When mouse steering active, 
    1) move mouse inwards and outwards to simulate hands holding steering wheel firmly or loose.
    2) left and right movements are mapped to steering direction.
  - When keyboard steering active, 
    1) down button simulates hold factor and decreases sensitivity, 
       up button increases sensitivity, also increasing hold factor.
    2) left and right buttons are mapped to steering direction.
  
  #
  ################################################## Have fun! ##########################################################
  
global:
  idle_tick_rate: 70
  persistent_joysticks: true
devices:
  hid:
    Virtual steering wheel:
      enabled: true
      description: ""
      name: MMVJ Steering Wheel
      persistent: true
      bus:
        type: Virtual
        vendor_id: 42
        product_id: 1
        version: 1
      force_feedback:
        enabled: true
        effects:
        - Constant
        - Spring
        - Friction
        - Ramp
        max_effects: 16
      controls:
        ABS_RY:
          type: ABS_RY
          range:
          - 0.0
          - 32767.0
        ABS_X:
          type: ABS_X
          range:
          - 0.0
          - 32767.0
        BTN_EAST:
          type: BTN_EAST
          range:
          - 0.0
          - 1.0
        BTN_NORTH:
          type: BTN_NORTH
          range:
          - 0.0
          - 1.0
        BTN_SOUTH:
          type: BTN_SOUTH
          range:
          - 0.0
          - 1.0
        BTN_WEST:
          type: BTN_WEST
          range:
          - 0.0
          - 1.0
        Dummy axis for Wine:
          type: ABS_Y
          range:
          - 0.0
          - 32767.0
        FORCE_FEEDBACK_X:
          type: FORCE_FEEDBACK_X
          range:
          - -32768.0
          - 32767.0
        FORCE_FEEDBACK_Y:
          type: FORCE_FEEDBACK_Y
          range:
          - -32768.0
          - 32767.0
    any_kbd:
      enabled: true
      description: ""
      match_name_regex: .+
      controls:
        KEY_DOWN:
          type: KEY_DOWN
          range:
          - 0.0
          - 2.0
        KEY_LEFT:
          type: KEY_LEFT
          range:
          - 0.0
          - 2.0
        KEY_RIGHT:
          type: KEY_RIGHT
          range:
          - 0.0
          - 2.0
        KEY_SPACE:
          type: KEY_SPACE
          range:
          - 0.0
          - 2.0
        KEY_UP:
          type: KEY_UP
          range:
          - 0.0
          - 2.0
    any_mouse:
      enabled: true
      description: ""
      match_name_regex: .+
      controls:
        REL_X:
          type: REL_X
          range:
          - -127.0
          - 127.0
        REL_Y:
          type: REL_Y
          range:
          - -127.0
          - 127.0
variables:
  "@ KBD steering: autocentering along force feedback":
    range:
    - 0.0
    - 1.0
    value: 0.31
  "@ KBD steering: autocentering halflife (sec)":
    range:
    - 0.0
    - 1.0
    value: 0.1
  "@ KBD steering: sensitivity base":
    range:
    - 0.0
    - 7.0
    value: 1.8
  "@ KBD steering: sensitivity decrease mutiplier":
    range:
    - 0.0
    - 1.0
    value: 0.7
  "@ KBD steering: sensitivity increase mutiplier":
    range:
    - 1.0
    - 5.0
    value: 1.4
  "@ MS steering: autocentering halflife (sec)":
    range:
    - 0.0
    - 1.0
    value: 0.65
  "@ MS steering: sensitivity":
    range:
    - 0.0
    - 1.0
    value: 0.06
  "@KBD steering: force feedback gain":
    range:
    - 0.0
    - 5.0
    value: 1.0
  "KBD STEERING: SENSITIVITY APPLIED":
    range:
    - 0.0
    - 20.0
  STEERING ACCUMULATOR:
    range:
    - -100.0
    - 100.0
  "STEERING HOLD FACTOR: APPLIED":
    range:
    - 0.0
    - 1.0
  "STEERING HOLD FACTOR: MOUSE":
    range:
    - 0.0
    - 100.0
mappings:
- name: "MOUSE STEERING: HOLD"
  enabled: true
  source:
    dev: any_mouse
    ctl: REL_Y
  destination:
    var: "STEERING HOLD FACTOR: MOUSE"
  transformation:
  - integrate:
      out_range:
      - 0.0
      - 600.0
      in_gain: 0.5
  - s_curve:
      steepness: 8.0
  - clamp:
      range:
      - 0.0
      - 530.0
      override_range: false
- name: MOUSE OR KEYBOARD STEERING
  enabled: true
  source:
    value: 0.0
    range:
    - 0.0
    - 0.0
  destination:
    dev: Virtual steering wheel
    ctl: ABS_X
  transformation:
  - script:
      desc: |
        This script choosees between mouse and keyboard signals to provide with further
        input to steering transformation. When either is moved - the mode is switched
        between mouse and keyboard steering.
      lang: Luau
      script: |+
        local ks_threshold = 0.01
        local ms_threshold = 0.1
        
        local kbd_left  = -transform("kbd_left_tfm", read("kbd_left"))
        local kbd_right =  transform("kbd_right_tfm", read("kbd_right"))
        
        local ks = math.clamp(kbd_left + kbd_right, -1, 1)
        local kbd_up = read("kbd_up")
        local kbd_hold = read("kbd_hold")
        local ks_hold_is_active = kbd_hold > ks_threshold or kbd_up > ks_threshold 
        
        local ms = read("ms")
        
        if use_mouse_steering == nil then
          use_mouse_steering = true
        elseif use_mouse_steering and (
          math.abs(ks) > ks_threshold or ks_hold_is_active
        ) then
          print("switched to keyboard steering [.'.]: left, righ, up ((configurable)increase steering speed + hold factor), down ((configurable) decrease in steering speed + hold factor)")
          use_mouse_steering = false
        elseif not use_mouse_steering and math.abs(ms) > ms_threshold then
          print("switched to mouse steering (|): left, righ, inwards == hold factor increase, outwards == hold factor decrease")
          use_mouse_steering = true
        end
        
        if use_mouse_steering then
        
          write("hold_applied", read("ms_hold"))
          write(0, transform("mouse_steering", ms * 127 ))
        
        else
        
          if last_time == nil then last_time = os.clock() end
          local dt = math.clamp((os.clock() - last_time), 0, 1/base_rate())
        
          local hold_applied = transform("kbd_hold_tfm", math.clamp(read("kbd_hold") + read("kbd_up"), 0, 1))
          write("hold_applied", hold_applied)
        
          local sens = read("ks_sens_base")
          if kbd_up > 0.1 then sens = sens * read("ks_sens_inc")
          elseif hold_applied > 0.1 then sens = sens * read("ks_sens_dec") end
          write("kbd_sens", sens);
         
          out = transform("kbd_steering", ks  * 100 * dt)
        
          if not ks_hold_is_active then
            out = transform("kbd_steering_post", out)
          end
        
          write(0, transform("kbd_steering_post_smoothing", out))
        
          last_time = os.clock()
        
        end
        
      out_range:
      - -1.0
      - 1.0
      output_relativity: Abs
      aux_srcs:
        kbd_hold:
          value:
            dev: any_kbd
            ctl: KEY_DOWN
          remap:
          - 0.0
          - 2.0
        kbd_hold_steering_sensitivity:
          value: 0.6
          range:
          - 0.0
          - 2.0
        kbd_left:
          value:
            dev: any_kbd
            ctl: KEY_LEFT
        kbd_right:
          value:
            dev: any_kbd
            ctl: KEY_RIGHT
        kbd_up:
          value:
            dev: any_kbd
            ctl: KEY_UP
        ks_sens_base:
          value:
            var: "@ KBD steering: sensitivity base"
        ks_sens_dec:
          value:
            var: "@ KBD steering: sensitivity decrease mutiplier"
          remap:
          - 0.0
          - 1.0
        ks_sens_inc:
          value:
            var: "@ KBD steering: sensitivity increase mutiplier"
        ms:
          value:
            dev: any_mouse
            ctl: REL_X
          remap:
          - -1.0
          - 1.0
        ms_hold:
          value:
            var: "STEERING HOLD FACTOR: MOUSE"
          remap:
          - 0.0
          - 1.0
      aux_dsts:
        hold_applied:
          value:
            var: "STEERING HOLD FACTOR: APPLIED"
        kbd_sens:
          value:
            var: "KBD STEERING: SENSITIVITY APPLIED"
      aux_transformations:
        kbd_hold_tfm:
          desc: Transform for Kbd Hold Factor (key Down)
          in_range:
          - 0.0
          - 2.0
          in_relativity: Rel
          steps:
          - clamp:
              range:
              - 0.0
              - 1.0
              override_range: true
          - script:
              enabled: false
              lang: Luau
              script: |-
                -- Just checking recursive script execution
                print(inputs[0])
                outputs[0] = inputs[0]
          - ema:
              on_relative_input_feed_on_idle: true
              tau: 0.06
          - clamp:
              range:
              - 0.0
              - 0.9
              override_range: false
        kbd_left_tfm:
          desc: Transform for Left Button Pressed
          in_range:
          - 0.0
          - 2.0
          in_relativity: Rel
          steps:
          - clamp:
              range:
              - 0.0
              - 1.0
              override_range: true
        kbd_right_tfm:
          desc: Transform for Right Button Pressed
          in_range:
          - 0.0
          - 2.0
          in_relativity: Rel
          steps:
          - clamp:
              range:
              - 0.0
              - 1.0
              override_range: true
        kbd_steering:
          desc: Transform for Left and Right buttons summed
          in_range:
          - -100.0
          - 100.0
          in_relativity: Rel
          steps:
          - steering:
              accumulator:
                value:
                  var: STEERING ACCUMULATOR
              in_gain:
                value:
                  var: "KBD STEERING: SENSITIVITY APPLIED"
              auto_center_halflife:
                value:
                  var: "@ KBD steering: autocentering halflife (sec)"
              auto_center_along_force_feedback:
                value:
                  var: "@ KBD steering: autocentering along force feedback"
              hold_factor:
                value:
                  var: "STEERING HOLD FACTOR: APPLIED"
              force_feedback:
                gain:
                  value:
                    var: "@KBD steering: force feedback gain"
                invert: false
                component: X
                transformation:
                - one_euro:
                    beta: 0.007
                    min_cutoff_hz: 1.0
                    d_cutoff_hz: 1.0
              integrated_user_input_transform:
              - one_euro:
                  enabled: false
                  beta: 0.007
                  min_cutoff_hz: 5.0
                  d_cutoff_hz: 1.0
        kbd_steering_post:
          in_range:
          - -1.0
          - 1.0
          in_relativity: Abs
          steps:
          - exp:
              base: 1.6
              center_symmetric: true
        kbd_steering_post_smoothing:
          in_range:
          - -1.0
          - 1.0
          in_relativity: Abs
          steps:
          - ema:
              tau: 0.02
        mouse_steering:
          in_range:
          - -127.0
          - 127.0
          in_relativity: Rel
          steps:
          - steering:
              accumulator:
                value:
                  var: STEERING ACCUMULATOR
              in_gain:
                value:
                  var: "@ MS steering: sensitivity"
              auto_center_halflife:
                value:
                  var: "@ MS steering: autocentering halflife (sec)"
              auto_center_along_force_feedback: 0.0
              hold_factor:
                value:
                  var: "STEERING HOLD FACTOR: APPLIED"
              force_feedback:
                gain: 1.0
                invert: false
                component: X
                transformation:
                - one_euro:
                    beta: 0.007
                    min_cutoff_hz: 1.0
                    d_cutoff_hz: 1.0
              integrated_user_input_transform:
              - exp:
                  base: 1.8
                  center_symmetric: true
ui:
  monitors:
  - name: Steering
    desc: ""
    enabled: true
    position:
      dev: Virtual steering wheel
      ctl: ABS_X
    hold:
      var: "STEERING HOLD FACTOR: APPLIED"
