description: |+
  
  #################### EXPERIMENTAL MOUSE + KBD STEERING CONFIGURATION EXAMPLE ##########
  #

    This is a no-scripting example, that uses summation and velocity_to_displacement
    transformation steps.

    Hold factor for mouse is bound to Y movement, for keyboard - to pressing UP or DOWN keys.

    WARNING: unlike scripted example this config does not YET support variable 
    keyboard steering sensitivity.

  #
  ################################# Have fun! ###########################################
  
global:
  idle_tick_rate: 60
  persistent_joysticks: true
devices:
