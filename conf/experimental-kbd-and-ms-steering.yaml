    Virtual steering wheel:
      enabled: true
      description: ""
      name: Steering wheel joystick.
      persistent: true
      bus:
        type: Virtual
        vendor_id: 42
        product_id: 1
        version: 1
      force_feedback:
        enabled: true
        effects:
        - Constant
        - Spring
        - Friction
        - Ramp
        max_effects: 16
      controls:
        ABS_RY:
          type: ABS_RY
          range:
          - 0.0
          - 32767.0
        ABS_X:
          type: ABS_X
          range:
          - 0.0
          - 32767.0
        BTN_EAST:
          type: BTN_EAST
          range:
          - 0.0
          - 1.0
        BTN_NORTH:
          type: BTN_NORTH
          range:
          - 0.0
          - 1.0
        BTN_SOUTH:
          type: BTN_SOUTH
          range:
          - 0.0
          - 1.0
        BTN_WEST:
          type: BTN_WEST
          range:
          - 0.0
          - 1.0
        Dummy axis for Wine:
          type: ABS_Y
          range:
          - 0.0
          - 32767.0
        FORCE_FEEDBACK_X:
          type: FORCE_FEEDBACK_X
          range:
          - -32768.0
          - 32767.0
        FORCE_FEEDBACK_Y:
          type: FORCE_FEEDBACK_Y
          range:
          - -32768.0
          - 32767.0
    any_kbd:
      enabled: true
      description: ""
      match_name_regex: .+
      controls:
        KEY_DOWN:
          type: KEY_DOWN
          range:
          - 0.0
          - 2.0
        KEY_LEFT:
          type: KEY_LEFT
          range:
          - 0.0
          - 2.0
        KEY_RIGHT:
          type: KEY_RIGHT
          range:
          - 0.0
          - 2.0
        KEY_SPACE:
          type: KEY_SPACE
          range:
          - 0.0
          - 2.0
        KEY_UP:
          type: KEY_UP
          range:
          - 0.0
          - 2.0
    any_mouse:
      enabled: true
      description: ""
      match_name_regex: .+
      controls:
        REL_X:
          type: REL_X
          range:
          - -127.0
          - 127.0
        REL_Y:
          type: REL_Y
          range:
          - -127.0
          - 127.0
variables:
  Hold factor:
    range:
    - 0.0
    - 1.0
  Mouse hold factor accumulator:
    range:
    - 0.0
    - 1.0
  "Null":
    range:
    - 0.0
    - 0.0
mappings:
- name: STEERING
  enabled: true
  source:
    value: 0.0
    range:
    - 0.0
    - 0.0
  destination:
    dev: Virtual steering wheel
    ctl: ABS_X
  transformation:
  - sum:
      enabled: true
      sources:
      - value:
          dev: any_mouse
          ctl: REL_X
        remap:
        - -1.0
        - 1.0
      - value:
          dev: any_kbd
          ctl: KEY_RIGHT
        transformation:
        - sum:
            enabled: true
            sources:
            - value:
                dev: any_kbd
                ctl: KEY_LEFT
              transformation:
              - invert:
                  enabled: true
              remap:
              - -2.0
              - 0.0
            out_interval:
            - -1.0
            - 1.0
        - velocity_to_displacement:
            enabled: true
            multiplier: 26.0
            out_interval:
            - -1.0
            - 1.0
        remap:
        - -1.0
        - 1.0
      out_interval:
      - -1.0
      - 1.0
  - steering:
      enabled: true
      accumulator:
        value: null
      deadzone_counts: 0.0
      input_gain: 0.08
      auto_center_halflife: 0.08
      auto_center_along_force_feedback: 0.0
      hold_factor:
        value:
          var: Hold factor
      force_feedback:
        enabled: true
        gain: 1.0
        invert: false
        component: X
        transformation: []
      integrated_user_input_transform: []
- name: HOLD FACTOR
  enabled: true
  source:
    value: 0.0
    range:
    - 0.0
    - 0.0
  destination:
    var: Hold factor
  transformation:
  - sum:
      enabled: true
      sources:
      - value:
          dev: any_mouse
          ctl: REL_Y
        transformation:
        - integrate:
            enabled: true
            range:
            - 0.0
            - 1.0
            accumulator:
              value:
                var: Mouse hold factor accumulator
            smoothing_alpha: 0.2
        remap:
        - 0.0
        - 1.0
      - value:
          dev: any_kbd
          ctl: KEY_DOWN
      - value:
          dev: any_kbd
          ctl: KEY_UP
      out_interval:
      - 0.0
      - 1.0
  - ema:
      enabled: true
      tau: 0.1
  - s_curve:
      enabled: true
      steepness: 6.5
  - clamp:
      enabled: true
      range:
      - 0.0
      - 0.85
      override_range: false
- name: MOUSE HOLD FACTOR RESET BY KBD
  enabled: true
  source:
    value: 0.0
    range:
    - 0.0
    - 0.0
  destination:
    var: Mouse hold factor accumulator
  transformation:
  - sum:
      enabled: true
      sources:
      - value:
          var: Mouse hold factor accumulator
        remap:
        - 0.0
        - 1.0
      - value:
          dev: any_kbd
          ctl: KEY_DOWN
        transformation:
        - invert:
            enabled: true
        remap:
        - -2.0
        - 0.0
      - value:
          dev: any_kbd
          ctl: KEY_UP
        transformation:
        - invert:
            enabled: true
        remap:
        - -2.0
        - 0.0
      - value:
          dev: any_kbd
          ctl: KEY_LEFT
        transformation:
        - invert:
            enabled: true
        remap:
        - -2.0
        - 0.0
      - value:
          dev: any_kbd
          ctl: KEY_RIGHT
        transformation:
        - invert:
            enabled: true
        remap:
        - -2.0
        - 0.0
      out_interval:
      - 0.0
      - 1.0
ui:
  monitors:
  - name: Steering
    desc: ""
    enabled: true
    position:
      dev: Virtual steering wheel
      ctl: ABS_X
    hold:
      var: Hold factor
