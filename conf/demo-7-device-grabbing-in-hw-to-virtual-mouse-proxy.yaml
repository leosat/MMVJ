title: Grabbed HW mouse to Virtual Mouse simple mappings
desc: |+
  This is the early WIP demo config showcasing device grabbing in one to one HW mouse to Virtual Mouse mapping scenario.

  Update matching regex of a grabbed mouse to match the one you want to grab and proxy!
  If everything works fine, you shall have the same experience with your mouse except for right button will not be working
  due to corresponding mapping intentionally disabled for demo purpose (see below).

  Refining this config will bring the following next improvements to the app:

  - Support of one-click grabbing without having to manually enter regex matching device name.
  - Device matching improvement: positive + negative matching patterns, matching by device ids' or file path.
  - Built-in transformation steps to derive (to further filter or ease and integrate back) mouse acceleration.

  Stay tuned and ...

  Have fun!

global:
  base_rate: 60
  persistent_joysticks: false
devices:
  hid:
    Grabbed physical mouse:
      match_name_regex: <PUT YOUR MOUSE NAME HERE!>
      grab: All
      controls:
        BTN_EXTRA:
          type: BTN_EXTRA
          range:
          - 0.0
          - 1.0
        BTN_LEFT:
          type: BTN_LEFT
          range:
          - 0.0
          - 1.0
        BTN_MIDDLE:
          type: BTN_MIDDLE
          range:
          - 0.0
          - 1.0
        BTN_RIGHT:
          type: BTN_RIGHT
          range:
          - 0.0
          - 1.0
        BTN_SIDE:
          type: BTN_SIDE
          range:
          - 0.0
          - 1.0
        REL_HWHEEL:
          type: REL_HWHEEL
          range:
          - -10.0
          - 10.0
        REL_HWHEEL_HI_RES:
          type: REL_HWHEEL_HI_RES
          range:
          - -120.0
          - 120.0
        REL_WHEEL:
          type: REL_WHEEL
          range:
          - -10.0
          - 10.0
        REL_WHEEL_HI_RES:
          type: REL_WHEEL_HI_RES
          range:
          - -120.0
          - 120.0
        REL_X:
          type: REL_X
          range:
          - -127.0
          - 127.0
        REL_X2:
          type: REL_X
          range:
          - -127.0
          - 127.0
        REL_Y:
          type: REL_Y
          range:
          - -127.0
          - 127.0
    Virtual Mice:
      name: Virtual Mouse
      persistent: false
      bus:
        type: Usb
        vendor_id: 1
        product_id: 2
        version: 3
      force_feedback:
        effects:
        - Rumble
        max_effects: 16
      controls:
        BTN_LEFT:
          type: BTN_LEFT
          range:
          - 0.0
          - 1.0
        BTN_MIDDLE:
          type: BTN_MIDDLE
          range:
          - 0.0
          - 1.0
        BTN_RIGHT:
          type: BTN_RIGHT
          range:
          - 0.0
          - 1.0
        BTN_SIDE:
          type: BTN_SIDE
          range:
          - 0.0
          - 1.0
        FORCE_FEEDBACK_X:
          type: FORCE_FEEDBACK_X
          range:
          - -32768.0
          - 32767.0
        FORCE_FEEDBACK_Y:
          type: FORCE_FEEDBACK_Y
          range:
          - -32768.0
          - 32767.0
        REL_HWHEEL:
          type: REL_HWHEEL
          range:
          - -10.0
          - 10.0
        REL_HWHEEL_HI_RES:
          type: REL_HWHEEL_HI_RES
          range:
          - -120.0
          - 120.0
        REL_WHEEL:
          type: REL_WHEEL
          range:
          - -10.0
          - 10.0
        REL_WHEEL_HI_RES:
          type: REL_WHEEL_HI_RES
          range:
          - -120.0
          - 120.0
        REL_X:
          type: REL_X
          range:
          - -127.0
          - 127.0
        REL_X2:
          type: REL_X
          range:
          - -127.0
          - 127.0
        REL_Y:
          type: REL_Y
          range:
          - -127.0
          - 127.0
variables: {}
map:
- name: "Grabbed to Virtual: X"
  src:
    dev: Grabbed physical mouse
    ctl: REL_X
  dst:
    dev: Virtual Mice
    ctl: REL_X
  tfm:
  - one_euro:
      beta: 0.007
      min_cutoff_hz: 8.0
      d_cutoff_hz: 1.0
  autorun: false
- name: "Grabbed to Virtual: Y"
  src:
    dev: Grabbed physical mouse
    ctl: REL_Y
  dst:
    dev: Virtual Mice
    ctl: REL_Y
  tfm:
  - one_euro:
      beta: 0.007
      min_cutoff_hz: 8.0
      d_cutoff_hz: 1.0
  autorun: false
- name: "Grabbed to Virtual: BTN LEFT"
  src:
    dev: Grabbed physical mouse
    ctl: BTN_LEFT
  dst:
    dev: Virtual Mice
    ctl: BTN_LEFT
- name: "Grabbed to Virtual:  BTN_RIGHT (Disabled for demo porposes!)"
  enabled: false
  src:
    dev: Grabbed physical mouse
    ctl: BTN_RIGHT
  dst:
    dev: Virtual Mice
    ctl: BTN_RIGHT
  autorun: false
- name: "Grabbed to Virtual: WHEEL LO RES"
  src:
    dev: Grabbed physical mouse
    ctl: REL_WHEEL
  dst:
    dev: Virtual Mice
    ctl: REL_WHEEL
ui: {}
