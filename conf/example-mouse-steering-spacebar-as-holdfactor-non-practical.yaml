description: |+
  
  #################### MOUSE STEERING CONFIGURATION EXAMPLE #############################
  #
  
  - Mouse relative Y movement is mapped to hold factor: move mouse to you to simulate hands 
    holding steering wheel firmly and move it further from you for the opposite.
  - Tweak steering transform settings to your taste: autocentering dynamics, force feedback
    application etc. 
  
  #
  ################################# Have fun! ###########################################
  
global:
  idle_tick_rate: 100
  persistent_joysticks: true
devices:
  hid:
    Virtual steering wheel:
      enabled: true
      description: ""
      name: Steering wheel joystick.
      persistent: true
      bus:
        type: Virtual
        vendor_id: 42
        product_id: 1
        version: 1
      force_feedback:
        enabled: true
        effects:
        - Constant
        - Spring
        - Friction
        - Ramp
        max_effects: 16
      controls:
        ABS_RY:
          type: ABS_RY
          range:
          - 0.0
          - 32767.0
        ABS_X:
          type: ABS_X
          range:
          - 0.0
          - 32767.0
        Dummy axis for Wine:
          type: ABS_Y
          range:
          - 0.0
          - 32767.0
        FORCE_FEEDBACK_X:
          type: FORCE_FEEDBACK_X
          range:
          - -32768.0
          - 32767.0
        FORCE_FEEDBACK_Y:
          type: FORCE_FEEDBACK_Y
          range:
          - -32768.0
          - 32767.0
    any_hid:
      enabled: true
      description: ""
      match_name_regex: .+
      controls:
        KEY_A:
          type: KEY_A
          range:
          - 0.0
          - 2.0
        KEY_SPACE:
          type: KEY_SPACE
          range:
          - 0.0
          - 2.0
        REL_X:
          type: REL_X
          range:
          - -127.0
          - 127.0
        REL_Y:
          type: REL_Y
          range:
          - -127.0
          - 127.0
variables:
  Steering Hold Factor:
    range:
    - 0.0
    - 100.0
mappings:
- name: Mouse Steering ^ Hold
  enabled: true
  source:
    dev: any_hid
    ctl: KEY_SPACE
  destination:
    var: Steering Hold Factor
  transformation:
  - ema:
      enabled: true
      tau: 0.017
- name: Mouse Steering <> Wheel
  enabled: true
  source:
    dev: any_hid
    ctl: REL_X
  destination:
    dev: Virtual steering wheel
    ctl: ABS_X
  transformation:
  - ema:
      enabled: true
      tau: 0.04
  - one_euro:
      enabled: false
      beta: 0.007
      min_cutoff_hz: 1.0
      d_cutoff_hz: 1.0
  - steering:
      enabled: true
      deadzone_counts: 0.0
      input_gain: 0.33
      auto_center_halflife: 0.15
      auto_center_along_force_feedback: 0.0
      hold_factor:
        value:
          var: Steering Hold Factor
      force_feedback:
        enabled: true
        gain: 1.0
        invert: false
        component: X
        transformation:
        - ema:
            enabled: true
            tau: 0.01
      integrated_user_input_transform:
      - exp:
          enabled: true
          base: 3.3
          center_symmetric: true
ui: {}
