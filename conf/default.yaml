# mmvj configuration.
# mmvj version: 2026.9.6-3
# Autogenerated at: 2026-09-08 13:40:30.957382724 UTC

description: |+
  
  #################### MOUSE STEERING CONFIGURATION EXAMPLE #############################
  #
  
  - move mouse inwards and outwards to simulate hands 
    holding steering wheel firmly or loose.
  - Tweak steering transform settings to your taste: autocentering dynamics, force feedback
    application etc. 
  
  #
  ################################# Have fun! ###########################################
  
global:
  idle_tick_rate: 100
  persistent_joysticks: true
devices:
  hid:
    Virtual steering wheel:
      name: Steering wheel joystick.
      persistent: true
      bus:
        type: Virtual
        vendor_id: 42
        product_id: 1
        version: 1
      force_feedback:
        effects:
        - Constant
        - Spring
        - Friction
        - Ramp
        max_effects: 16
      controls:
        ABS_RY:
          type: ABS_RY
          range:
          - 0.0
          - 32767.0
        ABS_X:
          type: ABS_X
          range:
          - 0.0
          - 32767.0
        BTN_EAST:
          type: BTN_EAST
          range:
          - 0.0
          - 1.0
        BTN_NORTH:
          type: BTN_NORTH
          range:
          - 0.0
          - 1.0
        BTN_SOUTH:
          type: BTN_SOUTH
          range:
          - 0.0
          - 1.0
        BTN_WEST:
          type: BTN_WEST
          range:
          - 0.0
          - 1.0
        Dummy axis for Wine:
          type: ABS_Y
          range:
          - 0.0
          - 32767.0
        FORCE_FEEDBACK_X:
          type: FORCE_FEEDBACK_X
          range:
          - -32768.0
          - 32767.0
        FORCE_FEEDBACK_Y:
          type: FORCE_FEEDBACK_Y
          range:
          - -32768.0
          - 32767.0
    any_kbd:
      match_name_regex: .+
      controls:
        KEY_DOWN:
          type: KEY_DOWN
          range:
          - 0.0
          - 2.0
        KEY_LEFT:
          type: KEY_LEFT
          range:
          - 0.0
          - 2.0
        KEY_RIGHT:
          type: KEY_RIGHT
          range:
          - 0.0
          - 2.0
        KEY_SPACE:
          type: KEY_SPACE
          range:
          - 0.0
          - 2.0
        KEY_UP:
          type: KEY_UP
          range:
          - 0.0
          - 2.0
    any_mouse:
      match_name_regex: .+
      controls:
        REL_X:
          type: REL_X
          range:
          - -127.0
          - 127.0
        REL_Y:
          type: REL_Y
          range:
          - -127.0
          - 127.0
variables:
  Steering Hold Factor:
    range:
    - 0.0
    - 100.0
map:
- name: Mouse Steering ^ Hold
  src:
    dev: any_mouse
    ctl: REL_Y
  dst:
    var: Steering Hold Factor
  tfm:
  - integrate:
      out_range:
      - 0.0
      - 600.0
      in_gain: 0.5
  - s_curve:
      steepness: 8.0
  - clamp:
      range:
      - 0.0
      - 530.0
      override_range: false
- name: Mouse Steering <> Wheel
  src:
    dev: any_mouse
    ctl: REL_X
  dst:
    dev: Virtual steering wheel
    ctl: ABS_X
  tfm:
  - ema:
      tau: 0.04
  - one_euro:
      enabled: false
      beta: 0.007
      min_cutoff_hz: 1.0
      d_cutoff_hz: 1.0
  - steering:
      in_gain: 0.1
      hold_factor:
        value:
          var: Steering Hold Factor
      auto_center_halflife: 0.15
      auto_center_along_force_feedback: 0.0
      tfm:
      - exp:
          base: 3.3
          center_symmetric: true
      force_feedback:
        gain: 1.0
        invert: false
        component: X
        tfm:
        - ema:
            tau: 0.01
- name: "Src: any_kbd.KEY_DOWN -> Dst: Virtual steering wheel.BTN_EAST"
  src:
    dev: any_kbd
    ctl: KEY_DOWN
  dst:
    dev: Virtual steering wheel
    ctl: BTN_EAST
  tfm:
  - nop: true
- name: "Src: any_kbd.KEY_SPACE -> Dst: Virtual steering wheel.BTN_NORTH"
  src:
    dev: any_kbd
    ctl: KEY_SPACE
  dst:
    dev: Virtual steering wheel
    ctl: BTN_NORTH
  tfm:
  - nop: true
- name: "Src: any_kbd.KEY_LEFT -> Dst: Virtual steering wheel.BTN_SOUTH"
  src:
    dev: any_kbd
    ctl: KEY_LEFT
  dst:
    dev: Virtual steering wheel
    ctl: BTN_SOUTH
  tfm:
  - nop: true
- name: "Src: any_kbd.KEY_RIGHT -> Dst: Virtual steering wheel.BTN_WEST"
  src:
    dev: any_kbd
    ctl: KEY_RIGHT
  dst:
    dev: Virtual steering wheel
    ctl: BTN_WEST
  tfm:
  - nop: true
ui:
  monitors:
  - name: Steering
    desc: ""
    enabled: true
    position:
      dev: Virtual steering wheel
      ctl: ABS_X
    hold:
      var: Steering Hold Factor
