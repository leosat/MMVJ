    ctl: Any F
  destination:
    dev: VJoy2
    ctl: Button East
  transformation:
  - nop: true
- name: Neutral gear.
  enabled: true
  source:
    dev: any_midi
    ctl: Any D
  destination:
    dev: VJoy2
    ctl: Button North
  transformation:
