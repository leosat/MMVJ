- name: "`Pressed unless pressed` #1"
  enabled: true
  source:
    dev: any_mouse
    ctl: Left Button
  destination:
    dev: VJoy2
    ctl: Button West
  transformation:
  - invert: {}
- name: "`Pressed unless pressed` #2"
  enabled: true
  source:
    dev: any_mouse
    ctl: Right Button
  destination:
    dev: VJoy2
    ctl: Button West
  transformation:
  - invert: {}
- name: Gear down.
  enabled: true
