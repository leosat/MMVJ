- name: Foot-brake pedal.
  enabled: true
  source:
    dev: any_midi
    ctl: "Any G#"
  destination:
    dev: VJoy2
    ctl: Footbreak Pedal
  transformation:
  - clamp:
      range:
      - 0.0
