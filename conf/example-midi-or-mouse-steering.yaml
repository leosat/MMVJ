variables:
  Steering Hold Factor:
    range:
    - 0.0
    - 100.0
mappings:
- name: Mouse-controlled steering wheel.
  enabled: true
  source:
    dev: any_mouse
    ctl: Left to Right Movement
  destination:
    dev: VJoy1
    ctl: Steering Wheel
  transformation:
  - ema:
      tau: 0.04
  - one_euro:
      enabled: false
      beta: 0.007
      min_cutoff_hz: 1.0
      d_cutoff_hz: 1.0
  - steering:
      in_gain: 0.1
      auto_center_halflife: 0.15
      auto_center_along_force_feedback: 0.0
      hold_factor:
        value:
          var: Steering Hold Factor
      force_feedback:
        gain: 1.0
        invert: false
        component: X
        transformation:
        - ema:
            tau: 0.01
      integrated_user_input_transform:
      - ema:
          tau: 0.005
      - exp:
          base: 3.3
          center_symmetric: true
- name: Steering wheel hold factor (how firmly your hands hold it)
  enabled: true
  source:
    dev: any_mouse
    ctl: Front to Back Movement
  destination:
    var: Steering Hold Factor
  transformation:
  - integrate:
      out_range:
      - 0.0
      - 600.0
      in_gain: 0.5
  - s_curve:
      steepness: 8.0
  - clamp:
      range:
      - 0.0
      - 530.0
      override_range: false
- name: "Steering wheel control with MIDI pitch wheel #1: curved mapping."
  enabled: true
  source:
    dev: any_midi
    ctl: Pitch
  destination:
    dev: VJoy1
    ctl: Steering Wheel
  transformation:
  - signed_power:
