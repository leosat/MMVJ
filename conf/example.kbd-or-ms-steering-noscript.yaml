# mmvj configuration.
# mmvj version: 2026.9.11-3
# Autogenerated at: 2026-09-11 19:42:18.956415288 UTC

desc: |+
  
  #################### EXPERIMENTAL MOUSE + KBD STEERING CONFIGURATION EXAMPLE ##########
  #
  
    This is a no-scripting example, that uses summation and velocity_to_displacement
    transformation steps.
  
    Hold factor for mouse is bound to Y movement, for keyboard - to pressing UP or DOWN keys.
    Key UP held pressed increases steering sensitivity (use it for quicker movement when on keyboard).
  
  #
  ################################# Have fun! ###########################################
  
global:
  idle_tick_rate: 60
  persistent_joysticks: true
devices:
  hid:
    Virtual steering wheel:
      name: Steering wheel joystick.
      persistent: true
      bus:
        type: Virtual
        vendor_id: 42
        product_id: 1
        version: 1
      force_feedback:
        effects:
        - Constant
        - Spring
        - Friction
        - Ramp
        max_effects: 16
      controls:
        ABS_RY:
          type: ABS_RY
          range:
          - 0.0
          - 32767.0
        ABS_X:
          type: ABS_X
          range:
          - 0.0
          - 32767.0
        BTN_EAST:
          type: BTN_EAST
          range:
          - 0.0
          - 1.0
        BTN_NORTH:
          type: BTN_NORTH
          range:
          - 0.0
          - 1.0
        BTN_SOUTH:
          type: BTN_SOUTH
          range:
          - 0.0
          - 1.0
        BTN_WEST:
          type: BTN_WEST
          range:
          - 0.0
          - 1.0
        Dummy axis for Wine:
          type: ABS_Y
          range:
          - 0.0
          - 32767.0
        FORCE_FEEDBACK_X:
          type: FORCE_FEEDBACK_X
          range:
          - -32768.0
          - 32767.0
        FORCE_FEEDBACK_Y:
          type: FORCE_FEEDBACK_Y
          range:
          - -32768.0
          - 32767.0
    any_kbd:
      match_name_regex: .+
      controls:
        KEY_DOWN:
          type: KEY_DOWN
          range:
          - 0.0
          - 2.0
        KEY_LEFT:
          type: KEY_LEFT
          range:
          - 0.0
          - 2.0
        KEY_RIGHT:
          type: KEY_RIGHT
          range:
          - 0.0
          - 2.0
        KEY_SPACE:
          type: KEY_SPACE
          range:
          - 0.0
          - 2.0
        KEY_UP:
          type: KEY_UP
          range:
          - 0.0
          - 2.0
    any_mouse:
      match_name_regex: .+
      controls:
        REL_X:
          type: REL_X
          range:
          - -127.0
          - 127.0
        REL_Y:
          type: REL_Y
          range:
          - -127.0
          - 127.0
variables:
  "@ Steering: base gain":
    range:
    - 0.0
    - 1.0
    value: 0.08
  "@ Steering: gain increase":
    range:
    - 0.0
    - 1.0
    value: 0.07
  Hold factor:
    range:
    - 0.0
    - 1.0
  Mouse hold factor accumulator:
    range:
    - 0.0
    - 1.0
  "Null":
    range:
    - 0.0
    - 0.0
  "Steering: effective sensitivity":
    range:
    - 0.0
    - 1.0
map:
- name: STEERING
  src:
    value: 0.0
    range:
    - 0.0
    - 0.0
  dst:
    dev: Virtual steering wheel
    ctl: ABS_X
  tfm:
  - sum:
      srcs:
      - value:
          dev: any_mouse
          ctl: REL_X
        remap:
        - -1.0
        - 1.0
      - value:
          dev: any_kbd
          ctl: KEY_RIGHT
        tfm:
        - sum:
            srcs:
            - value:
                dev: any_kbd
                ctl: KEY_LEFT
              tfm:
              - invert: {}
              remap:
              - -2.0
              - 0.0
            out_range:
            - -1.0
            - 1.0
        - velocity_to_displacement:
            multiplier: 13.0
            out_range:
            - -1.0
            - 1.0
        remap:
        - -1.0
        - 1.0
      out_range:
      - -1.0
      - 1.0
  - steering:
      accumulator:
        value: null
      in_gain:
        value:
          var: "Steering: effective sensitivity"
      hold_factor:
        value:
          var: Hold factor
      auto_center_halflife: 0.08
      auto_center_along_force_feedback: 0.96
      force_feedback:
        gain: 1.1
        invert: false
        component: X
- name: HOLD FACTOR
  src:
    value: 0.0
    range:
    - 0.0
    - 0.0
  dst:
    var: Hold factor
  tfm:
  - sum:
      srcs:
      - value:
          dev: any_mouse
          ctl: REL_Y
        tfm:
        - integrate:
            out_range:
            - 0.0
            - 1.0
            accumulator:
              value:
                var: Mouse hold factor accumulator
            in_gain: 0.2
        remap:
        - 0.0
        - 1.0
      - value:
          dev: any_kbd
          ctl: KEY_DOWN
      - value:
          dev: any_kbd
          ctl: KEY_UP
      out_range:
      - 0.0
      - 1.0
  - ema:
      tau: 0.1
  - s_curve:
      steepness: 6.5
  - clamp:
      range:
      - 0.0
      - 0.8
      override_range: false
- name: MOUSE HOLD FACTOR RESET BY KBD
  src:
    value: 0.0
    range:
    - 0.0
    - 0.0
  dst:
    var: Mouse hold factor accumulator
  tfm:
  - sum:
      srcs:
      - value:
          var: Mouse hold factor accumulator
        remap:
        - 0.0
        - 1.0
      - value:
          dev: any_kbd
          ctl: KEY_DOWN
        tfm:
        - invert: {}
        remap:
        - -2.0
        - 0.0
      - value:
          dev: any_kbd
          ctl: KEY_UP
        tfm:
        - invert: {}
        remap:
        - -2.0
        - 0.0
      - value:
          dev: any_kbd
          ctl: KEY_LEFT
        tfm:
        - invert: {}
        remap:
        - -2.0
        - 0.0
      - value:
          dev: any_kbd
          ctl: KEY_RIGHT
        tfm:
        - invert: {}
        remap:
        - -2.0
        - 0.0
      out_range:
      - 0.0
      - 1.0
- name: STEERING GAIN
  src:
    var: "@ Steering: base gain"
  dst:
    var: "Steering: effective sensitivity"
  tfm:
  - sum:
      srcs:
      - value:
          var: "@ Steering: gain increase"
        tfm:
        - mul:
            srcs:
            - value:
                dev: any_kbd
                ctl: KEY_UP
              tfm:
              - clamp:
                  range:
                  - 0.0
                  - 1.0
                  override_range: false
ui:
  monitors:
  - name: Steering
    desc: ""
    enabled: true
    position:
      dev: Virtual steering wheel
      ctl: ABS_X
    hold:
      var: Hold factor
