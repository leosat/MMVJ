mappings:
- name: Scripting test
  enabled: true
  source:
    var: "@ ~o,o~ @"
  destination:
    dev: VJoy1
    ctl: ABS_RY
  transformation:
  - clamp:
      enabled: true
      from: -100.0
      to: 100.0
      override_range: true
  - script:
      enabled: true
      lang: Luau
      script: |-
        ---------------------------------------------------------
        
        now = os.clock()
        if last == nil then last = now end
        dt = now - last
        
        ---------------------------------------------------------
        
        all_gain = 50
        ffb_in = inputs[1]
        aux_a_mul = inputs[2] * dt
        aux_gain = inputs[3]
        
        ---------------------------------------------------------
        
        
        if ffb_in < -1 or ffb_in > 1 then
            print("Out of range ffb: ", ffb_in, "check the input config, remapped to a wrong range!")
            return
        end
        
        if out == nil then out = 0 end
        
        print("    ~ Force feedback X input is: ", ffb_in)
        print("    ~ Aux signal gain is: ", aux_a_mul)
        
        if math.abs(inputs[1]) < 0.0001 then
          print "----"
          print "[attention please] No force feedback input detected, use ``ffcfstress -d /dev/input/event<OUR DEVICE NUMBER> '' to inject some force feedback..."
        end
        
        print("---------------------------------------------------------")
        
        -----------------------------------------------------------------
        
        -- if ffb_in < 0.3 and ffb_in > -0.3 then
        --   ffb_in = ffb_in*2
        -- end
        
        -----------------------------------------------------------------
        if aux_a1 == nil then aux_a1 = 0 end
        if aux_a2 == nil then aux_a2 = 0 end
        if aux_a3 == nil then aux_a3 = 0 end
        
        aux_a1 += 0.6 * aux_a_mul
        aux_ps1 = 0
        aux_a2 += 0.1  * aux_a_mul
        aux_ps2 = 0.3
        aux_a3 += 0.05  * aux_a_mul
        aux_ps3 = 2.9
        
        -----------------------------------------------------------------
        
        aux_s = math.sin(aux_a1 + aux_ps1) + math.sin(aux_a2 + aux_ps2)*1.7 + math.sin(aux_a3 + aux_ps3)
        
        out = all_gain * ( ffb_in + aux_s * (1 - math.abs(ffb_in)) * aux_gain )
        
        if out > 100   then  out = 100 end
        if out < -100  then  out = -100 end
        
        -----------------------------------------------------------------
        
        outputs[0] = out
        outputs[1] = out
        outputs[2] = out / 2
        outputs[3] = out
        outputs[4] = out*10
        
        ---------------------------------------------------------
        
        last = now
      aux_srcs:
        "1":
          remap_to_interval:
          - -1.0
          - 1.0
          source:
            dev: VJoy1
            ctl: "[Auto-created] Force Feedback X"
        "2":
