description: |
  Scripting example using Luau.
  
  inputs[0] is the main script "from-pipeline" input
  outputs[0] is the main script "to-pipeline" output
  
  Example script generates some periodic signal. If force feedback on component X 
  is supplied to the associated virtual joystick it's mixed-in, the strength of the
  former is reduced proportionally to the strength of the force feedback.
  
  Feel free to define any number of auxiliary inputs and outputs for the script.
  Access values under other indexes in inputs and outputs tables.
  
  Have fun!
