name: Build and Auto-Release AppImage

on:
  push:
    branches: [ "main" ]
  workflow_run:
    workflows: ["Common testing"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: mmvj
  DISPLAY_NAME: MMVJ
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  check-release:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m 1 '^version =' Cargo.toml | cut -d '"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

          if gh release view "v$VERSION" &> /dev/null; then
            echo "Release v$VERSION already exists. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Release v$VERSION does not exist. Proceeding with build."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build-appimage:
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: "rust-cache-shared-release-${{ matrix.arch }}"

      - name: Set VERSION environment variable
        run: echo "VERSION=${{ needs.check-release.outputs.version }}" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libfontconfig1-dev \
            libxcb1-dev \
            libx11-dev \
            libwayland-dev \
            libssl-dev \
            file \
            wget \
            zip

      - name: Install appimagetool
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage" -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      - name: Install cargo-binstall and cargo-appimage
        run: |
          # Use cargo-binstall for fast prebuilt binary install; fallback to cargo install
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cargo-appimage || cargo install cargo-appimage --locked

      - name: Run tests
        run: cargo test --release

      - name: Build AppImage with cargo-appimage
        run: |
          cargo appimage

      - name: Prepare Release Archives
        run: |
          # cargo-appimage produces the file in the project root: target/appimage/ or ./
          RAW_APPIMAGE=$(find . -maxdepth 5 -name "*.AppImage" -o -name "*.appimage" | head -n 1)
          if [ -z "$RAW_APPIMAGE" ]; then
            echo "Error: AppImage file not found after build!"
            exit 1
          fi

          FINAL_APPIMAGE="${{ env.APP_NAME }}-v${{ env.VERSION }}-${{ matrix.arch }}.AppImage"
          mv "$RAW_APPIMAGE" "$FINAL_APPIMAGE"
          chmod +x "$FINAL_APPIMAGE"

          echo "APPIMAGE_FILE=$FINAL_APPIMAGE" >> $GITHUB_ENV

          STAGING_DIR="${{ env.APP_NAME }}-v${{ env.VERSION }}-${{ matrix.arch }}"
          mkdir -p "$STAGING_DIR"
          cp -a "$FINAL_APPIMAGE" "$STAGING_DIR/"

          TAR_ARCHIVE="${{ env.APP_NAME }}-v${{ env.VERSION }}-${{ matrix.arch }}.tar.gz"
          tar -czvf "$TAR_ARCHIVE" "$STAGING_DIR"

          ZIP_ARCHIVE="${{ env.APP_NAME }}-v${{ env.VERSION }}-${{ matrix.arch }}.zip"
          zip -r "$ZIP_ARCHIVE" "$STAGING_DIR"

          echo "TAR_ARCHIVE=$TAR_ARCHIVE" >> $GITHUB_ENV
          echo "ZIP_ARCHIVE=$ZIP_ARCHIVE" >> $GITHUB_ENV

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-bundle-${{ matrix.arch }}
          path: |
            ${{ env.APPIMAGE_FILE }}
            ${{ env.TAR_ARCHIVE }}
            ${{ env.ZIP_ARCHIVE }}
          retention-days: 1

  release:
    needs: [check-release, build-appimage]
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.APP_NAME }}-bundle-*
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-release.outputs.version }}
          name: MMVJ v${{ needs.check-release.outputs.version }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
